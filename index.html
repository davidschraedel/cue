<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cue — improv music prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&family=Playfair+Display:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #070605;
      --fg: #e3e3e3;
      --mut: rgba(232, 223, 216, .46);
      --faint: rgba(232, 223, 216, .26);
      --line: rgba(255, 255, 255, .07);
      --acc: #70b5ff;
      --flesh: #a8d2ff;
      --glow: #0e4b82;
      --beat: 4s;
      --hi: .5;
      --lo: .2;
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --bg: #f5f6f7;
        --fg: #0f172a;
        --mut: rgba(51, 65, 85, .62);
        --faint: rgba(51, 65, 85, .35);
        --line: rgba(51, 65, 85, .10);
        --acc: #bcb029;
        --flesh: #716912;
        --glow: #fbf8d1;
        box-shadow: inset 0 0 7rem color-mix(in srgb, black 10%, transparent);
      }
    }

    :root[data-theme="light"] {
      --bg: #f5f6f7;
      --fg: #0f172a;
      --mut: rgba(51, 65, 85, .62);
      --faint: rgba(51, 65, 85, .35);
      --line: rgba(51, 65, 85, .10);
      --acc: #bcb029;
      --flesh: #716912;
      --glow: #fbf8d1;
      box-shadow: inset 0 0 7rem color-mix(in srgb, black 10%, transparent);
    }

    :root[data-theme="dark"] {
      --bg: #070605;
      --fg: #e3e3e3;
      --mut: rgba(232, 223, 216, .46);
      --faint: rgba(232, 223, 216, .26);
      --line: rgba(255, 255, 255, .07);
      --acc: #70b5ff;
      --flesh: #a8d2ff;
      --glow: #0e4b82;
      box-shadow: inset 0 0 9rem color-mix(in srgb, var(--glow) 20%, transparent);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "DM Sans", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden
    }

    ::selection {
      background: var(--acc);
      color: #fff
    }

    .glow {
      position: fixed;
      left: 50%;
      top: 34%;
      width: min(900px, 120vw);
      aspect-ratio: 1.25;
      translate: -50% -50%;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--glow), transparent);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      opacity: var(--lo);
      animation: beat var(--beat) ease-in-out infinite
    }

    body.still .glow {
      animation: none;
      opacity: calc((var(--lo) + var(--hi)) * 0.45)
    }

    @keyframes beat {
      0% {
        opacity: var(--lo);
        scale: 1
      }

      14% {
        opacity: var(--hi);
        scale: 1.05
      }

      100% {
        opacity: var(--lo);
        scale: 1
      }
    }

    header,
    main,
    footer {
      position: relative;
      z-index: 1
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.6rem clamp(1.5rem, 5vw, 3.5rem)
    }

    .hdr-controls {
      display: flex;
      align-items: center;
      gap: 1rem
    }

    .color-pick {
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: none;
      overflow: hidden
    }

    .color-pick::-webkit-color-swatch-wrapper {
      padding: 0
    }

    .color-pick::-webkit-color-swatch {
      border: none;
      border-radius: 50%
    }

    .color-pick::-moz-color-swatch {
      border: none;
      border-radius: 50%
    }

    .mark {
      font-family: "Cormorant Garamond", serif;
      font-weight: 300;
      font-size: 1.7rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      transition: opacity .2s
    }

    .mark:hover {
      opacity: .5
    }

    .theme-toggle {
      background: none;
      border: 0;
      color: var(--mut);
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      transition: color .3s, background .3s
    }

    .theme-toggle:hover {
      color: var(--fg);
      background: var(--line)
    }

    .theme-toggle svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .pulse {
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: .78rem;
      letter-spacing: .12em;
      display: flex;
      align-items: center;
      gap: .7rem;
      cursor: pointer;
      padding: .5rem
    }

    .pulse i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--acc);
      display: block
    }

    body:not(.still) .pulse i {
      animation: beat var(--beat) ease-in-out infinite
    }

    .pulse:hover {
      color: var(--fg)
    }

    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 5vw, 3.5rem) 6rem
    }

    .hero {
      min-height: 58vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 0 2.5rem
    }

    .say {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.6rem, 3.6vw, 2.6rem);
      line-height: 1.38;
      max-width: 32em;
      margin: 0 0 3rem;
      padding: 1.2rem 1.8rem;
      border-radius: .8rem;
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      text-wrap: balance;
      text-shadow: 0 0 40px color-mix(in srgb, var(--acc) 30%, transparent);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    :root[data-theme="light"] .say,
    :root:not([data-theme="dark"]) .say {
      text-shadow: none;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      animation: card-beat var(--beat) ease-in-out infinite;
      will-change: box-shadow;
    }

    :root[data-theme="light"] .say.sw,
    :root:not([data-theme="dark"]) .say.sw {
      animation: swap .6s ease-out, card-beat var(--beat) ease-in-out infinite;
    }

    body.still .say {
      animation: none !important;
    }

    body.still .say.sw {
      animation: swap .6s ease-out !important;
    }

    @keyframes card-beat {
      0% {
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.06),
          0 4px 12px -2px rgba(15, 23, 42, 0.03);
      }

      14% {
        box-shadow:
          0 0 0 1.5px color-mix(in srgb, var(--acc) 50%, transparent),
          0 0 18px -2px color-mix(in srgb, var(--acc) 30%, transparent),
          0 10px 26px -4px color-mix(in srgb, var(--acc) 45%, transparent);
      }

      100% {
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.06),
          0 4px 12px -2px rgba(15, 23, 42, 0.03);
      }
    }

    .say.empty {
      color: var(--mut)
    }

    .roll {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--fg);
      background: color-mix(in srgb, var(--acc) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
      border-radius: 999px;
      padding: 1rem 3rem;
      cursor: pointer;
      transition: background .4s, border-color .4s, box-shadow .4s, transform .2s
    }

    .roll:hover {
      background: color-mix(in srgb, var(--acc) 18%, transparent);
      border-color: var(--acc)
    }

    :root[data-theme="light"] .roll,
    :root:not([data-theme="dark"]) .roll {
      background: color-mix(in srgb, var(--acc) 8%, white);
      border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent);
      box-shadow: 0 2px 10px -2px color-mix(in srgb, var(--acc) 20%, transparent);
    }

    :root[data-theme="light"] .roll:hover,
    :root:not([data-theme="dark"]) .roll:hover {
      background: color-mix(in srgb, var(--acc) 16%, white);
      border-color: var(--acc);
      box-shadow: 0 4px 16px -2px color-mix(in srgb, var(--acc) 30%, transparent);
      transform: translateY(-1px);
    }

    .hint {
      margin: 1.4rem 0 0;
      font-size: .78rem;
      letter-spacing: .06em;
      color: var(--faint)
    }

    #list {
      background: color-mix(in srgb, var(--fg) 1%, transparent);
      /* border: 1px solid var(--line); */
      border-radius: 1.25rem;
      padding: 0.35rem clamp(1.2rem, 3.5vw, 2.2rem);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    :root[data-theme="light"] #list,
    :root:not([data-theme="dark"]) #list {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(15, 23, 42, 0.06);
      animation: list-beat var(--beat) ease-in-out infinite;
      will-change: box-shadow;
    }

    body.still #list {
      animation: none !important;
    }

    @keyframes list-beat {
      0% {
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.05),
          0 4px 14px -2px rgba(15, 23, 42, 0.02);
      }

      14% {
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--acc) 35%, transparent),
          0 0 14px -2px color-mix(in srgb, var(--acc) 22%, transparent),
          0 8px 24px -6px color-mix(in srgb, var(--acc) 32%, transparent);
      }

      100% {
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.05),
          0 4px 14px -2px rgba(15, 23, 42, 0.02);
      }
    }

    :root[data-theme="light"] .glow,
    :root:not([data-theme="dark"]) .glow {
      display: none;
    }

    .row {
      display: grid;
      grid-template-columns: 8.5rem 1fr auto;
      gap: 1rem;
      align-items: baseline;
      padding: 0.9rem 0;
      border-top: 1px solid var(--line);
    }

    .row:first-child {
      border-top: none;
    }

    .row:last-child {
      border-bottom: none;
    }

    .lab {
      font-size: .8rem;
      font-weight: 400;
      letter-spacing: .1em;
      color: var(--acc);
    }

    :root[data-theme="light"] .lab,
    :root:not([data-theme="dark"]) .lab {
      -webkit-text-stroke: 0.3px rgba(0, 0, 0, 0.5);
      paint-order: stroke fill;
    }

    :root[data-theme="dark"] .lab {
      -webkit-text-stroke: 0.3px rgba(255, 255, 255, 0.5);
      paint-order: stroke fill;
    }

    .v {
      font-family: "Playfair Display", serif;
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      line-height: 1.25;
      display: block;
      transition: color .4s
    }

    .s {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--mut);
      display: block;
      margin-top: .15rem;
      min-height: 1.2em
    }

    .row.on .v {
      color: var(--flesh)
    }

    .ctl {
      display: flex;
      gap: .25rem;
      align-self: center
    }

    .ic {
      width: 2.4rem;
      height: 2.4rem;
      background: none;
      border: 0;
      border-radius: 50%;
      color: var(--faint);
      cursor: pointer;
      display: grid;
      place-items: center;
      overflow: visible;
      transition: color .3s, background .3s
    }

    .ic:hover:not(:disabled) {
      color: var(--fg);
      background: var(--line)
    }

    .ic:disabled {
      opacity: .25;
      cursor: default
    }

    .ic[aria-pressed="true"] {
      color: var(--acc)
    }

    .ic svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ic[aria-pressed="true"] rect {
      fill: currentColor
    }

    button:focus-visible {
      outline: 1px solid var(--acc);
      outline-offset: 3px
    }

    .sw {
      animation: swap .6s ease-out
    }

    @keyframes swap {
      from {
        opacity: 0;
        filter: blur(7px)
      }

      to {
        opacity: 1;
        filter: none
      }
    }

    footer {
      text-align: center;
      padding: 0 1.5rem 3rem;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      color: var(--faint)
    }

    @media(max-width:640px) {
      .row {
        grid-template-columns: 1fr auto;
        row-gap: .3rem
      }

      .lab {
        grid-column: 1/-1
      }

      .hero {
        min-height: 52vh
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .glow,
      .pulse i {
        animation: none !important
      }

      .sw {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>
  <header>
    <a href="index.html" class="mark" id="logoLink" title="Reset all prompts">Cue</a>
    <div class="hdr-controls">
      <input type="color" id="colorPick" class="color-pick" value="#70b5ff" title="Accent color">
      <button class="pulse" id="pulse" aria-pressed="true"><i></i><span>Pulse on</span></button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"></button>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="say empty" id="say" aria-live="polite">Press the button when you're ready.</p>
      <button class="roll" id="roll">New prompt</button>
      <p class="hint">Lock/unlock parameters. Click "New prompt" (Space bar)</p>
    </section>
    <section id="list" aria-label="Prompt parameters"></section>
  </main>
  <footer>
    <p>Create</p>
    <p style="margin-top:.8rem;font-size:.72rem;letter-spacing:.08em">© 2026 David Schraedel</p>
  </footer>
  <script>
    const R = n => Math.floor(Math.random() * n), pick = a => a[R(a.length)];
    const cap = s => s.replace(/(^|[.!?]\s+)([a-z])/g, (_, a, b) => a + b.toUpperCase());
    const KEYS = ["tempo", "meter", "phrasing", "style", "quality", "texture", "energy", "sound", "tonal"];
    const LAB = { tempo: "Tempo", meter: "Meter", phrasing: "Phrasing", style: "Style", quality: "Quality", texture: "Texture", energy: "Energy", sound: "Sound", tonal: "Tonal color" };

    const BANDS = [[55, ["glacial", "barely moving", "suspended"]], [75, ["slow and heavy", "unhurried", "wading"]], [100, ["walking pace", "easy", "loose"]], [130, ["moving", "brisk", "leaning forward"]], [160, ["driving", "urgent", "skittering"]], [999, ["racing", "frantic", "breathless"]]];
    const METERS = [[0, []], [2, []], [3, []], [4, []], [5, ["3+2", "2+3"]], [6, ["3+3", "2+2+2"]], [7, ["2+2+3", "3+2+2", "2+3+2"]], [9, ["3+3+3", "2+2+2+3", "4+5"]], [10, ["3+2+3+2", "5+5", "2+3+2+3"]], [11, ["3+3+3+2", "4+4+3", "2+2+3+2+2"]], [12, ["3+3+3+3", "4+4+4", "6+6"]], [13, ["3+3+3+2+2", "4+4+5"]]];
    const COUNTS = ["8", "8 + 8", "4", "4 + 4 + 8", "6", "12", "16", "7", "5 + 3", "8 + 8 + 4 + 4", "3 + 3 + 2", "10", "9", "2 × 8, then 4 + 4", "4 + 4 + 4 + 2", "5", "3", "11", "8 + 4", "6 + 6 + 4"];
    const ENTER = ["begin on 1", "pickup on the and of the last count", "start after a breath of silence", "come in on 3", "enter late, on 5", "start mid-gesture, no announcement", "build in from nothing"];
    const END = ["resolve on 1", "hold the last count", "fade out", "hard cut", "dissolve into silence", "repeat once, then stop", "trail off unfinished", "land on a single hit"];
    const STYLE = ["waltz", "march", "tango", "lullaby", "ritual", "mechanical", "industrial", "pastoral", "glitch", "blues", "lament", "processional", "carnival", "hymn", "folk dance", "brushed jazz", "trance", "music box", "chase scene", "heartbeat", "tide", "machine hum", "dub", "gamelan", "minimal ostinato", "breakbeat", "clockwork", "desert caravan", "nightclub", "underwater"];
    const QUAL = ["sustained", "percussive", "vibratory", "suspended", "swinging", "erratic", "collapsing", "bound", "floating", "released", "sharp", "melting", "pressing", "dragging", "quivering", "lunging", "hovering", "rolling", "heavy", "brittle", "slippery", "pulsing", "spiraling", "staccato"];
    const TEX = ["sparse", "dense", "a single line", "layered", "drone-based", "polyrhythmic", "clustered", "dry", "washed in reverb", "spacious", "thick", "interlocking", "call and response", "rubbed and scraped", "granular", "stacked ostinatos"];
    const REG = ["low", "mid", "high", "whole-range", "top and bottom, nothing between"];
    const ARC = ["steady", "building", "fading", "swelling", "lurching", "ebb and flow", "plateau, then drop", "sudden surges"];
    const SND = ["hand drums", "drum kit", "electronic drums", "synth", "piano", "electric keys", "bowed metal", "prepared piano", "found objects", "voice", "bass", "kalimba", "gong", "cymbal swells", "loop pedal", "contact mic", "shakers and rattles", "cello", "modular synth", "frame drum", "sampler", "singing bowls", "body percussion", "sine tones", "tape hiss"];
    const TON = ["major", "minor", "modal", "atonal", "drone", "noise", "unpitched", "pentatonic", "whole-tone", "clusters", "open fifths", "ambiguous", "dissonant", "bright", "dark", "bluesy"];

    const G = {
      tempo() {
        const bpm = 40 + R(151), feel = pick(BANDS.find(b => bpm <= b[0])[1]);
        const note = R(8) === 0 ? pick([", half-time feel", ", double-time feel"]) : "";
        const phrase = pick([`around ${bpm}`, `${bpm}, ${feel}`, `at about ${bpm}`, `${bpm} and ${feel}`]) + note;
        return { v: bpm + " BPM", s: feel + note, bpm, feel, note, phrase }
      },
      meter() {
        const [n, gs] = pick(METERS);
        if (!n) { const phrase = pick(["no meter, free time", "unmetered", "free time, no grid"]); return { v: "Free time", s: "no fixed pulse, breathe it", n: 0, phrase } }
        const g = gs.length ? pick(gs) : "";
        const phrase = g ? pick([`in ${n}, grouped ${g.replace(/\+/g, "-")}`, `a ${n} feel, ${g.replace(/\+/g, "-")}`]) : pick([`in ${n}`, `a ${n} feel`]);
        return { v: String(n), s: g ? "grouped " + g : "straight", n, g, phrase }
      },
      phrasing() {
        const c = pick(COUNTS), en = pick(ENTER), ed = pick(END);
        const phrase = pick([`phrases of ${c}`, `${c} counts`, `phrase it ${c}`]) + `, ${en}, ${ed}`;
        return { v: c + " counts", s: en + ", " + ed, c, en, ed, phrase }
      },
      style() { const a = pick(STYLE); let b = pick(STYLE); const v = R(4) === 0 && b !== a ? a + " meets " + b : a; return { v, s: "" } },
      quality() { return { v: pick(QUAL), s: "" } },
      texture() { const t = pick(TEX), r = pick(REG); return { v: t, s: r + " register", t, r } },
      energy() { const n = 1 + R(10), a = pick(ARC); return { v: n + " of 10", s: a, n, a } },
      sound() {
        if (R(12) === 0) return { v: "Your choice", s: "anything within reach", l: ["whatever you like"] };
        const a = pick(SND), l = [a];
        if (R(3) === 0) { const rest = SND.filter(x => x !== a); if (rest.length) l.push(pick(rest)) }
        return { v: l.join(" + "), s: "", l }
      },
      tonal() { return { v: pick(TON), s: "" } }
    };

    const OPENS = ["Give me", "Let's have", "Try", "I'd like", "Take"];
    const sentenceCfg = { template: 0, open: OPENS[0] };

    function say() {
      const { tempo: t, meter: m, phrasing: p, style: s, quality: q, texture: x, energy: e, sound: so, tonal: to } = P;
      const tm = t.phrase, mt = m.phrase, ph = p.phrase;
      const tx = `${x.t}, ${x.r} register`, sn = so.l.join(" and "), en = `energy at ${e.n}, ${e.a}`;
      const open = sentenceCfg.open;
      const T = [
        `${open} something ${mt}, ${tm}. ${q.v} and ${s.v}. ${ph}. ${tx}, with ${sn}. ${en}.`,
        `${mt}, ${tm}. Think ${s.v}, ${q.v}. ${ph}. ${sn}: ${tx}. Tonal color, ${to.v}. ${en}.`,
        `${open} ${s.v}, ${q.v}, ${mt} at ${t.bpm}. ${tx}. ${sn}. ${ph}. ${en}.`,
        `${sn}, please. ${s.v}, ${q.v}. ${mt}, ${tm}. ${ph}. ${tx}. ${en}, ${to.v}.`
      ];
      return cap(T[sentenceCfg.template]);
    }

    const P = {}, L = {}, rows = {};
    const list = document.getElementById("list"), sayEl = document.getElementById("say");
    const SHACKLE = { on: "M8 11V8a4 4 0 018 0v3", off: "M8 11V8a4 4 0 017.4-2.1" };
    KEYS.forEach(k => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span class="lab">${LAB[k]}</span><div><span class="v">—</span><span class="s"></span></div>
  <div class="ctl"><button class="ic re" aria-label="Reroll ${LAB[k]}" disabled><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4"/></svg></button>
  <button class="ic lk" aria-label="Lock ${LAB[k]}" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="${SHACKLE.off}"/></svg></button></div>`;
      list.appendChild(r);
      rows[k] = { el: r, v: r.querySelector(".v"), s: r.querySelector(".s"), re: r.querySelector(".re"), lk: r.querySelector(".lk"), p: r.querySelector(".lk path") };
      rows[k].re.onclick = () => { if (!L[k]) { P[k] = G[k](); paint([k]) } };
      rows[k].lk.onclick = () => { L[k] = !L[k]; paint([]) };
    });

    /* --- Sentence row --- */
    const sentenceRow = document.createElement("div"); sentenceRow.className = "row";
    sentenceRow.innerHTML = `<span class="lab">Sentence</span><div><span class="v">—</span><span class="s"></span></div>
    <div class="ctl"><button class="ic re" aria-label="Reroll Sentence" disabled><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4"/></svg></button>
    <button class="ic lk" aria-label="Lock Sentence" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="${SHACKLE.off}"/></svg></button></div>`;
    list.appendChild(sentenceRow);
    const sRow = {
      el: sentenceRow,
      v: sentenceRow.querySelector(".v"),
      s: sentenceRow.querySelector(".s"),
      re: sentenceRow.querySelector(".re"),
      lk: sentenceRow.querySelector(".lk"),
      p: sentenceRow.querySelector(".lk path")
    };
    let sentenceLocked = false;
    sRow.re.onclick = () => {
      if (!sentenceLocked && KEYS.every(k => P[k])) {
        sentenceCfg.template = R(4);
        sentenceCfg.open = pick(OPENS);
        paint([], true);
      }
    };
    sRow.lk.onclick = () => {
      sentenceLocked = !sentenceLocked;
      sRow.el.classList.toggle("on", sentenceLocked);
      sRow.lk.setAttribute("aria-pressed", sentenceLocked);
      sRow.lk.setAttribute("aria-label", (sentenceLocked ? "Unlock" : "Lock") + " Sentence");
      sRow.p.setAttribute("d", sentenceLocked ? SHACKLE.on : SHACKLE.off);
      sRow.re.disabled = sentenceLocked;
    };

    function flash(el) { el.classList.remove("sw"); void el.offsetWidth; el.classList.add("sw") }
    function paint(changed, sentenceChanged = false) {
      KEYS.forEach(k => {
        const r = rows[k], d = P[k]; if (!d) return;
        r.v.textContent = d.v; r.s.textContent = d.s;
        r.el.classList.toggle("on", !!L[k]);
        r.lk.disabled = false; r.lk.setAttribute("aria-pressed", !!L[k]);
        r.lk.setAttribute("aria-label", (L[k] ? "Unlock " : "Lock ") + LAB[k]);
        r.p.setAttribute("d", L[k] ? SHACKLE.on : SHACKLE.off);
        r.re.disabled = !!L[k];
        if (changed.includes(k)) { flash(r.v); flash(r.s) }
      });
      if (KEYS.every(k => P[k])) {
        sayEl.textContent = say(); sayEl.classList.remove("empty");
        if (changed.length || sentenceChanged) { flash(sayEl) }
        sRow.v.textContent = sentenceCfg.open + "…";
        sRow.s.textContent = ["narrative", "direct", "conversational", "shorthand"][sentenceCfg.template];
        sRow.lk.disabled = false; sRow.re.disabled = sentenceLocked;
        if (sentenceChanged) { flash(sRow.v); flash(sRow.s) }
      }
      let b = 60 / P.tempo.bpm; while (b < .3) b *= 2;
      const hi = .15 + .04 * P.energy.n;
      const st = document.documentElement.style;
      st.setProperty("--beat", b.toFixed(3) + "s"); st.setProperty("--hi", hi.toFixed(2)); st.setProperty("--lo", (hi * .35).toFixed(2));
    }
    function rollAll() {
      const first = !P.tempo, ch = KEYS.filter(k => first || !L[k]);
      ch.forEach(k => P[k] = G[k]());
      let sentenceChanged = false;
      if (!sentenceLocked) {
        sentenceCfg.template = R(4);
        sentenceCfg.open = pick(OPENS);
        sentenceChanged = true;
      }
      paint(ch, sentenceChanged);
    }
    document.getElementById("roll").onclick = rollAll;
    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") {
        e.preventDefault();
        rollAll();
      }
    });
    const pb = document.getElementById("pulse");
    pb.onclick = () => {
      const still = document.body.classList.toggle("still");
      pb.setAttribute("aria-pressed", !still); pb.querySelector("span").textContent = still ? "Pulse off" : "Pulse on"
    };

    /* --- Color picker --- */
    function hexToHSL(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0, s = 0, l = (max + min) / 2;
      if (d) {
        s = l > .5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }
    /* --- Theme toggle & color sync --- */
    const SUN_ICON = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    const MOON_ICON = `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const themeBtn = document.getElementById("themeToggle");
    const colorPick = document.getElementById("colorPick");

    const THEME_DEFAULTS = {
      dark: "#70b5ff",
      light: "#bcb029"
    };

    const chosenColors = {
      dark: null,
      light: null
    };

    function applyAccentColor(hex, theme) {
      const st = document.documentElement.style;
      if (!hex) {
        st.removeProperty("--acc");
        st.removeProperty("--glow");
        st.removeProperty("--flesh");
        return;
      }
      const [h, s, l] = hexToHSL(hex);
      st.setProperty("--acc", `hsl(${h}, ${s}%, ${l}%)`);
      if (theme === "light") {
        st.setProperty("--glow", `hsl(${h}, ${Math.max(s - 15, 20)}%, ${Math.min(Math.max(l + 30, 82), 95)}%)`);
        st.setProperty("--flesh", `hsl(${h}, ${Math.max(s - 10, 15)}%, ${Math.max(Math.min(l - 22, 34), 14)}%)`);
      } else {
        st.setProperty("--glow", `hsl(${h}, ${s}%, ${Math.max(l - 20, 10)}%)`);
        st.setProperty("--flesh", `hsl(${h}, ${Math.max(s - 15, 10)}%, ${Math.min(l + 12, 85)}%)`);
      }
    }

    function getSystemTheme() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    function getActiveTheme() {
      const saved = localStorage.getItem("cue-theme");
      if (saved === "light" || saved === "dark") return saved;
      return getSystemTheme();
    }
    function applyTheme(theme, isManual = false) {
      document.documentElement.setAttribute("data-theme", theme);
      if (isManual) {
        localStorage.setItem("cue-theme", theme);
      }
      themeBtn.innerHTML = theme === "dark" ? SUN_ICON : MOON_ICON;
      const label = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
      themeBtn.setAttribute("aria-label", label);
      themeBtn.setAttribute("title", label);

      const chosen = chosenColors[theme];
      if (chosen) {
        applyAccentColor(chosen, theme);
        colorPick.value = chosen;
      } else {
        applyAccentColor(null, theme);
        colorPick.value = THEME_DEFAULTS[theme];
      }
    }
    applyTheme(getActiveTheme());

    themeBtn.onclick = () => {
      const current = document.documentElement.getAttribute("data-theme") || getActiveTheme();
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next, true);
    };

    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => {
        if (!localStorage.getItem("cue-theme")) {
          applyTheme(e.matches ? "light" : "dark");
        }
      });
    }

    const onColorChange = e => {
      const theme = document.documentElement.getAttribute("data-theme") || getActiveTheme();
      chosenColors[theme] = e.target.value;
      applyAccentColor(e.target.value, theme);
    };
    colorPick.addEventListener("input", onColorChange);
    colorPick.addEventListener("change", onColorChange);

    /* --- Logo home route & reset --- */
    document.getElementById("logoLink").addEventListener("click", e => {
      if (window.location.protocol !== "file:") {
        e.preventDefault();
        const homePath = window.location.pathname.replace(/index\.html$/, "");
        window.location.href = homePath || "./";
      }
    });
  </script>
</body>

</html>
