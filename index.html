<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cue — improv music prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&family=Playfair+Display:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #070605;
      --fg: #e3e3e3;
      --mut: rgba(232, 223, 216, .46);
      --faint: rgba(232, 223, 216, .26);
      --line: rgba(255, 255, 255, .07);
      --acc: #70b5ff;
      --flesh: #a8d2ff;
      --glow: #0e4b82;
      --beat: 4s;
      --hi: .5;
      --lo: .2;
      --pulse-say-ring: 26%;
      --pulse-say-glow: 15%;
      --pulse-say-drop: 18%;
      --pulse-card-ring: 18%;
      --pulse-card-glow: 11%;
      --pulse-card-drop: 14%;
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --bg: #fbfbfb;
        --fg: #0f172a;
        --mut: rgba(51, 65, 85, .62);
        --faint: rgba(51, 65, 85, .35);
        --line: rgba(51, 65, 85, .10);
        --acc: #297dbc;
        --flesh: #194366;
        --glow: #d8ecfb;
        box-shadow: inset 0 0 2rem rgba(0, 0, 0, 0.05);
      }
    }

    :root[data-theme="light"] {
      --bg: #fbfbfb;
      --fg: #0f172a;
      --mut: rgba(51, 65, 85, .62);
      --faint: rgba(51, 65, 85, .35);
      --line: rgba(51, 65, 85, .10);
      --acc: #297dbc;
      --flesh: #194366;
      --glow: #d8ecfb;
      box-shadow: inset 0 0 2rem rgba(0, 0, 0, 0.05);
    }

    :root[data-theme="dark"] {
      --bg: #070605;
      --fg: #e3e3e3;
      --mut: rgba(232, 223, 216, .46);
      --faint: rgba(232, 223, 216, .26);
      --line: rgba(255, 255, 255, .07);
      --acc: #70b5ff;
      --flesh: #a8d2ff;
      --glow: #0e4b82;
      box-shadow: inset 0 0 9rem color-mix(in srgb, var(--glow) 20%, transparent);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "DM Sans", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden
    }

    ::selection {
      background: var(--acc);
      color: #fff
    }

    .glow {
      position: fixed;
      left: 50%;
      top: 34%;
      width: min(900px, 120vw);
      aspect-ratio: 1.25;
      translate: -50% -50%;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--glow), transparent);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      opacity: var(--lo);
      animation: beat var(--beat) ease-in-out infinite
    }

    body.still .glow {
      animation: none;
      opacity: calc((var(--lo) + var(--hi)) * 0.45)
    }

    @keyframes beat {
      0% {
        opacity: var(--lo);
        scale: 1
      }

      14% {
        opacity: var(--hi);
        scale: 1.05
      }

      100% {
        opacity: var(--lo);
        scale: 1
      }
    }

    header,
    main,
    footer {
      position: relative;
      z-index: 1
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.6rem clamp(1.5rem, 5vw, 3.5rem)
    }

    .hdr-controls {
      display: flex;
      align-items: center;
      gap: 1rem
    }

    .color-pick {
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: none;
      overflow: hidden
    }

    .color-pick::-webkit-color-swatch-wrapper {
      padding: 0
    }

    .color-pick::-webkit-color-swatch {
      border: none;
      border-radius: 50%
    }

    .color-pick::-moz-color-swatch {
      border: none;
      border-radius: 50%
    }

    .mark {
      font-family: "Cormorant Garamond", serif;
      font-weight: 300;
      font-size: 1.7rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      transition: opacity .2s
    }

    .mark:hover {
      opacity: .5
    }

    .theme-toggle {
      background: none;
      border: 0;
      color: var(--mut);
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      transition: color .3s, background .3s
    }

    .theme-toggle:hover {
      color: var(--fg);
      background: var(--line)
    }

    .theme-toggle svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .pulse {
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: .78rem;
      letter-spacing: .12em;
      display: flex;
      align-items: center;
      gap: .7rem;
      cursor: pointer;
      padding: .5rem
    }

    .pulse i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--acc);
      display: block
    }

    body:not(.still) .pulse i {
      animation: beat var(--beat) ease-in-out infinite
    }

    .pulse:hover {
      color: var(--fg)
    }

    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 5vw, 3.5rem) 2.5rem;
    }

    .hero {
      min-height: 40vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 0 1.5rem;
    }

    .say {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.6rem, 3.9vw, 2.35rem);
      line-height: 1.36;
      max-width: 32em;
      min-height: 22rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 1.5rem;
      padding: 1.1rem 1.75rem;
      border-radius: 0.5rem;
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      text-wrap: balance;
      text-shadow: 0 0 40px color-mix(in srgb, var(--acc) 30%, transparent);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      position: relative;
      border: 1px solid transparent;
    }

    .say.sw {
      animation: swap .6s ease-out;
    }

    :root[data-theme="light"] .say,
    :root:not([data-theme="dark"]) .say {
      text-shadow: none;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid transparent;
      animation: card-beat var(--beat) ease-in-out infinite;
      will-change: box-shadow;
    }

    :root[data-theme="light"] .say.sw,
    :root:not([data-theme="dark"]) .say.sw {
      animation: swap .6s ease-out, card-beat var(--beat) ease-in-out infinite;
    }

    body.still .say {
      animation: none !important;
    }

    body.still .say.sw {
      animation: swap .6s ease-out !important;
    }

    @keyframes card-beat {

      0%,
      100% {
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.05),
          0 3px 10px -2px rgba(15, 23, 42, 0.025);
      }

      14% {
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--acc) var(--pulse-say-ring, 26%), transparent),
          0 0 10px -1px color-mix(in srgb, var(--acc) var(--pulse-say-glow, 15%), transparent),
          0 4px 14px -3px color-mix(in srgb, var(--acc) var(--pulse-say-drop, 18%), transparent);
      }
    }

    .say.empty {
      color: var(--mut)
    }

    .roll {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--fg);
      background: color-mix(in srgb, var(--acc) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
      border-radius: 999px;
      padding: 1rem 3rem;
      cursor: pointer;
      transition: background .1s, border-color .3s, box-shadow .1s, transform .2s
    }

    .roll:hover {
      background: color-mix(in srgb, var(--acc) 18%, transparent);
      border-color: var(--acc)
    }

    :root[data-theme="light"] .roll,
    :root:not([data-theme="dark"]) .roll {
      background: color-mix(in srgb, var(--acc) 8%, white);
      border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent);
      box-shadow: 0 2px 10px -2px color-mix(in srgb, var(--acc) 20%, transparent);
    }

    :root[data-theme="light"] .roll:hover,
    :root:not([data-theme="dark"]) .roll:hover {
      background: color-mix(in srgb, var(--acc) 16%, white);
      border-color: var(--acc);
      box-shadow: 0 4px 16px -2px color-mix(in srgb, var(--acc) 30%, transparent);
      transform: translateY(-1px);
    }

    .hint {
      margin: 1.4rem 0 0;
      font-size: .78rem;
      letter-spacing: .06em;
      color: var(--faint)
    }

    .params-col {
      display: none;
    }

    .param-card,
    #list {
      position: relative;
      background: color-mix(in srgb, var(--fg) 1%, transparent);
      border: 1px solid transparent;
      border-radius: 2.5rem;
      padding: 0.35rem clamp(1.2rem, 3.5vw, 2.2rem);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    :root[data-theme="light"] .param-card,
    :root:not([data-theme="dark"]) .param-card,
    :root[data-theme="light"] #list,
    :root:not([data-theme="dark"]) #list {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid transparent;
      animation: list-beat var(--beat) ease-in-out infinite;
      will-change: box-shadow;
    }

    body.still .param-card,
    body.still #list {
      animation: none !important;
    }

    @keyframes list-beat {

      0%,
      100% {
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.05),
          0 3px 10px -2px rgba(15, 23, 42, 0.02);
      }

      14% {
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--acc) var(--pulse-card-ring, 18%), transparent),
          0 0 9px -1px color-mix(in srgb, var(--acc) var(--pulse-card-glow, 11%), transparent),
          0 3px 12px -3px color-mix(in srgb, var(--acc) var(--pulse-card-drop, 14%), transparent);
      }
    }

    :root[data-theme="dark"] .say::after,
    :root:not([data-theme="light"]) .say::after,
    :root[data-theme="dark"] .param-card::after,
    :root:not([data-theme="light"]) .param-card::after,
    :root[data-theme="dark"] #list::after,
    :root:not([data-theme="light"]) #list::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      border: 1px solid color-mix(in srgb, var(--acc) 5%, transparent);
      pointer-events: none;
      opacity: 0;
      animation: dark-card-border var(--beat) ease-in-out infinite;
      will-change: opacity;
    }

    body.still .say::after,
    body.still .param-card::after,
    body.still #list::after {
      animation: none !important;
      opacity: 0;
    }

    @keyframes dark-card-border {

      0%,
      100% {
        opacity: 0;
      }

      14% {
        opacity: 1;
      }
    }

    :root[data-theme="light"] .glow,
    :root:not([data-theme="dark"]) .glow {
      display: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "lab ctl"
        "val val";
      row-gap: 0.3rem;
      column-gap: 0.5rem;
      align-items: center;
      padding: 0.85rem 0;
    }

    .lab-btn {
      grid-area: lab;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: none;
      padding: 0.38rem 0.5rem;
      margin-left: -0.5rem;
      margin-top: -0.18rem;
      margin-bottom: -0.18rem;
      border-radius: 999px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      width: fit-content;
      transition: background .15s ease, box-shadow .25s ease, transform .15s ease, opacity .2s;
    }

    .lab-btn:hover:not(:disabled) {
      background: var(--acc);
      box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--acc) 50%, transparent);
    }

    .lab-btn:hover:not(:disabled) .lab {
      color: var(--bg);
      -webkit-text-stroke: 0 !important;
      opacity: 1;
    }

    .lab-btn:hover:not(:disabled) .re-icon {
      stroke: var(--bg);
      transform: rotate(45deg);
    }

    .lab-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .lab-btn:disabled {
      cursor: default;
    }

    .re-icon {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: var(--faint);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .3s, transform .25s ease;
      flex-shrink: 0;
    }

    .lab {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--acc);
      cursor: inherit;
      transition: color .25s ease;
    }

    .v-wrap {
      grid-area: val;
      min-width: 0;
    }

    .ctl {
      grid-area: ctl;
      display: flex;
      align-self: center;
      justify-self: end;
    }

    :root[data-theme="light"] .lab,
    :root:not([data-theme="dark"]) .lab {
      -webkit-text-stroke: 0.3px rgba(0, 0, 0, 0.5);
      paint-order: stroke fill;
    }

    :root[data-theme="dark"] .lab {
      -webkit-text-stroke: 0.3px rgba(255, 255, 255, 0.5);
      paint-order: stroke fill;
    }

    .v {
      font-family: "Playfair Display", serif;
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      line-height: 1.25;
      display: block;
      transition: color .4s;
      opacity: 0.6;
    }

    .s {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--mut);
      display: block;
      margin-top: .15rem;
      min-height: 1.2em
    }

    .row.on .v {
      color: var(--flesh);
    }

    .ic {
      width: 2.4rem;
      height: 2.4rem;
      background: none;
      border: 0;
      border-radius: 50%;
      color: var(--faint);
      cursor: pointer;
      display: grid;
      place-items: center;
      overflow: visible;
      transition: color .3s, background .3s
    }

    .ic:hover:not(:disabled) {
      color: var(--fg);
      background: var(--line)
    }

    .ic:disabled {
      opacity: .25;
      cursor: default
    }

    .ic[aria-pressed="true"] {
      color: var(--acc)
    }

    .ic svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ic[aria-pressed="true"] rect {
      fill: currentColor
    }

    button:focus-visible {
      outline: 1px solid var(--acc);
      outline-offset: 3px
    }

    .sw {
      animation: swap .6s ease-out
    }

    @keyframes swap {
      from {
        opacity: 0;
        filter: blur(7px)
      }

      to {
        filter: none
      }
    }

    footer {
      text-align: center;
      padding: 1.25rem 1.5rem 2.8rem;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      color: var(--faint);
    }

    @media(max-width:640px) {
      .hero {
        min-height: 42vh;
      }
    }

    @media(min-width:1100px) {
      body {
        height: 100vh;
        overflow-y: auto;
      }

      header {
        padding: 1.6rem clamp(1.5rem, 5vw, 3.5rem);
      }

      footer {
        padding: 1.2rem 1.5rem 2.6rem;
      }

      footer p {
        margin: 0;
        line-height: 1.35;
      }

      footer p:last-child {
        margin-top: 0.5rem !important;
      }

      main {
        flex: 1;
        max-width: 94rem;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-rows: auto auto;
        column-gap: 0;
        row-gap: 0;
        align-content: center;
        align-items: end;
        justify-content: center;
        padding: 0 clamp(0.75rem, 2vw, 1.75rem);
      }

      .hero {
        grid-column: 2;
        grid-row: 1;
        min-height: auto;
        padding: 0 1.5rem 1.4rem;
        align-self: center;
      }

      .say {
        margin: 0 0 3rem;
        padding: 1rem 1.75rem;
        font-size: clamp(1.55rem, 2.45vw, 2.25rem);
        line-height: 1.36;
        min-height: 22rem;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .roll {
        padding: 0.75rem 2.6rem;
        font-size: 1.28rem;
      }

      .hint {
        margin: 0.65rem 0 0;
        font-size: 0.78rem;
      }

      .params-col {
        display: block;
        padding: 0.5rem 1.35rem;
      }

      .params-col.left {
        grid-column: 1;
        grid-row: 1;
        align-self: end;
        border-bottom: none;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        clip-path: polygon(-40px -40px, 100% -40px, 100% 100%, -40px 100%);
      }

      .params-col.right {
        grid-column: 3;
        grid-row: 1;
        align-self: end;
        border-bottom: none;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        clip-path: polygon(0 -40px, calc(100% + 40px) -40px, calc(100% + 40px) 100%, 0 100%);
      }

      .params-col .row {
        padding: 0.5rem 0;
        row-gap: 0.2rem;
      }

      .params-col .v {
        font-size: clamp(1.2rem, 1.5vw, 1.5rem);
        line-height: 1.25;
      }

      .params-col .s {
        font-size: 0.98rem;
      }

      #list {
        grid-column: 1 / 4;
        grid-row: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        column-gap: 0;
        row-gap: 0;
        align-items: stretch;
        padding: 0;
        border-top-left-radius: 0;
        border-top-right-radius: 0;
        border-bottom-left-radius: 2.5rem;
        border-bottom-right-radius: 2.5rem;
        clip-path: polygon(-40px 0, calc(100% + 40px) 0, calc(100% + 40px) calc(100% + 40px), -40px calc(100% + 40px));
      }

      :root[data-theme="dark"] .params-col.left::after,
      :root:not([data-theme="light"]) .params-col.left::after {
        border-right: none;
        border-bottom: none;
      }

      :root[data-theme="dark"] .params-col.right::after,
      :root:not([data-theme="light"]) .params-col.right::after {
        border-left: none;
        border-bottom: none;
      }

      :root[data-theme="dark"] #list::after,
      :root:not([data-theme="light"]) #list::after {
        border-top: none;
      }

      #list .row {
        padding: 0.65rem 1.35rem;
        row-gap: 0.2rem;
      }

      #list .v {
        font-size: clamp(1.2rem, 1.5vw, 1.5rem);
        line-height: 1.25;
      }

      #list .s {
        font-size: 0.98rem;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .glow,
      .pulse i {
        animation: none !important
      }

      .sw {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>
  <header>
    <a href="index.html" class="mark" id="logoLink" title="Reset all prompts">Cue</a>
    <div class="hdr-controls">
      <input type="color" id="colorPick" class="color-pick" value="#70b5ff" title="Accent color">
      <button class="pulse" id="pulse" aria-pressed="true"><i></i><span>Pulse on</span></button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"></button>
    </div>
  </header>
  <main>
    <div class="param-card params-col left" id="listLeft" aria-label="Prompt parameters left"></div>
    <section class="hero">
      <p class="say empty" id="say" aria-live="polite">Press the button when you're ready.</p>
      <button class="roll" id="roll">New prompt</button>
      <p class="hint">(Space bar)</p>
    </section>
    <div class="param-card params-col right" id="listRight" aria-label="Prompt parameters right"></div>
    <div class="param-card" id="list" aria-label="Prompt parameters"></div>
  </main>
  <footer>
    <p>Create</p>
    <p style="margin-top:.8rem;font-size:.72rem;letter-spacing:.08em">© 2026 David Schraedel</p>
  </footer>
  <script>
    const R = n => Math.floor(Math.random() * n), pick = a => a[R(a.length)];
    const cap = s => s.replace(/(^|[.!?]\s+)([a-z])/g, (_, a, b) => a + b.toUpperCase());
    const KEYS = ["tempo", "meter", "phrasing", "style", "quality", "texture", "energy", "sound", "tonal"];
    const LAB = { tempo: "Tempo", meter: "Meter", phrasing: "Phrasing", style: "Style", quality: "Quality", texture: "Texture", energy: "Energy", sound: "Sound", tonal: "Tonal color" };

    const BANDS = [[55, ["glacial", "barely moving", "suspended"]], [75, ["slow and heavy", "unhurried", "wading"]], [100, ["walking pace", "easy", "loose"]], [130, ["moving", "brisk", "leaning forward"]], [160, ["driving", "urgent", "skittering"]], [999, ["racing", "frantic", "breathless"]]];
    const METERS = [[0, []], [2, []], [3, []], [4, []], [5, ["3+2", "2+3"]], [6, ["3+3", "2+2+2"]], [7, ["2+2+3", "3+2+2", "2+3+2"]], [9, ["3+3+3", "2+2+2+3", "4+5"]], [10, ["3+2+3+2", "5+5", "2+3+2+3"]], [11, ["3+3+3+2", "4+4+3", "2+2+3+2+2"]], [12, ["3+3+3+3", "4+4+4", "6+6"]], [13, ["3+3+3+2+2", "4+4+5"]]];
    const COUNTS = ["8", "8 + 8", "4", "4 + 4 + 8", "6", "12", "16", "7", "5 + 3", "8 + 8 + 4 + 4", "3 + 3 + 2", "10", "9", "2 × 8, then 4 + 4", "4 + 4 + 4 + 2", "5", "3", "11", "8 + 4", "6 + 6 + 4"];
    const ENTER = ["begin on 1", "pickup on the and of the last count", "start after a breath of silence", "come in on 3", "enter late, on 5", "start mid-gesture, no announcement", "build in from nothing"];
    const END = ["resolve on 1", "hold the last count", "fade out", "hard cut", "dissolve into silence", "repeat once, then stop", "trail off unfinished", "land on a single hit"];
    const STYLE = ["waltz", "march", "tango", "lullaby", "ritual", "mechanical", "industrial", "pastoral", "glitch", "blues", "lament", "processional", "carnival", "hymn", "folk dance", "brushed jazz", "trance", "music box", "chase scene", "heartbeat", "tide", "machine hum", "dub", "gamelan", "minimal ostinato", "breakbeat", "clockwork", "desert caravan", "nightclub", "underwater"];
    const QUAL = ["sustained", "percussive", "vibratory", "suspended", "swinging", "erratic", "collapsing", "bound", "floating", "released", "sharp", "melting", "pressing", "dragging", "quivering", "lunging", "hovering", "rolling", "heavy", "brittle", "slippery", "pulsing", "spiraling", "staccato"];
    const TEX = ["sparse", "dense", "a single line", "layered", "drone-based", "polyrhythmic", "clustered", "dry", "washed in reverb", "spacious", "thick", "interlocking", "call and response", "rubbed and scraped", "granular", "stacked ostinatos"];
    const REG = ["low", "mid", "high", "whole-range", "top and bottom, nothing between"];
    const ARC = ["steady", "building", "fading", "swelling", "lurching", "ebb and flow", "plateau, then drop", "sudden surges"];
    const SND = ["hand drums", "drum kit", "electronic drums", "synth", "piano", "electric keys", "bowed metal", "prepared piano", "found objects", "voice", "bass", "kalimba", "gong", "cymbal swells", "loop pedal", "contact mic", "shakers and rattles", "cello", "modular synth", "frame drum", "sampler", "singing bowls", "body percussion", "sine tones", "tape hiss"];
    const TON = ["major", "minor", "modal", "atonal", "drone", "noise", "unpitched", "pentatonic", "whole-tone", "clusters", "open fifths", "ambiguous", "dissonant", "bright", "dark", "bluesy"];

    const G = {
      tempo() {
        const bpm = 40 + R(151), feel = pick(BANDS.find(b => bpm <= b[0])[1]);
        const note = R(8) === 0 ? pick([", half-time feel", ", double-time feel"]) : "";
        const phrase = pick([`around ${bpm}`, `${bpm}, ${feel}`, `at about ${bpm}`, `${bpm} and ${feel}`]) + note;
        return { v: bpm + " BPM", s: feel + note, bpm, feel, note, phrase }
      },
      meter() {
        const [n, gs] = pick(METERS);
        if (!n) { const phrase = pick(["no meter, free time", "unmetered", "free time, no grid"]); return { v: "Free time", s: "no fixed pulse, breathe it", n: 0, phrase } }
        const g = gs.length ? pick(gs) : "";
        const phrase = g ? pick([`in ${n}, grouped ${g.replace(/\+/g, "-")}`, `a ${n} feel, ${g.replace(/\+/g, "-")}`]) : pick([`in ${n}`, `a ${n} feel`]);
        return { v: String(n), s: g ? "grouped " + g : "straight", n, g, phrase }
      },
      phrasing() {
        const c = pick(COUNTS), en = pick(ENTER), ed = pick(END);
        const phrase = pick([`phrases of ${c}`, `${c} counts`, `phrase it ${c}`]) + `, ${en}, ${ed}`;
        return { v: c + " counts", s: en + ", " + ed, c, en, ed, phrase }
      },
      style() { const a = pick(STYLE); let b = pick(STYLE); const v = R(4) === 0 && b !== a ? a + " meets " + b : a; return { v, s: "" } },
      quality() { return { v: pick(QUAL), s: "" } },
      texture() { const t = pick(TEX), r = pick(REG); return { v: t, s: r + " register", t, r } },
      energy() { const n = 1 + R(10), a = pick(ARC); return { v: n + " of 10", s: a, n, a } },
      sound() {
        if (R(12) === 0) return { v: "Your choice", s: "anything within reach", l: ["whatever you like"] };
        const a = pick(SND), l = [a];
        if (R(3) === 0) { const rest = SND.filter(x => x !== a); if (rest.length) l.push(pick(rest)) }
        return { v: l.join(" + "), s: "", l }
      },
      tonal() { return { v: pick(TON), s: "" } }
    };

    const OPENS = ["Give me", "Let's have", "Try", "I'd like", "Take"];
    const sentenceCfg = { template: 0, open: OPENS[0] };

    function say() {
      const { tempo: t, meter: m, phrasing: p, style: s, quality: q, texture: x, energy: e, sound: so, tonal: to } = P;
      const tm = t.phrase, mt = m.phrase, ph = p.phrase;
      const tx = `${x.t}, ${x.r} register`, sn = so.l.join(" and "), en = `energy at ${e.n}, ${e.a}`;
      const open = sentenceCfg.open;
      const T = [
        `${open} something ${mt}, ${tm}. ${q.v} and ${s.v}. ${ph}. ${tx}, with ${sn}. ${en}.`,
        `${mt}, ${tm}. Think ${s.v}, ${q.v}. ${ph}. ${sn}: ${tx}. Tonal color, ${to.v}. ${en}.`,
        `${open} ${s.v}, ${q.v}, ${mt} at ${t.bpm}. ${tx}. ${sn}. ${ph}. ${en}.`,
        `${sn}, please. ${s.v}, ${q.v}. ${mt}, ${tm}. ${ph}. ${tx}. ${en}, ${to.v}.`
      ];
      return cap(T[sentenceCfg.template]);
    }

    const P = {}, L = {}, rows = {};
    const listLeft = document.getElementById("listLeft");
    const listRight = document.getElementById("listRight");
    const listBottom = document.getElementById("list");
    const sayEl = document.getElementById("say");

    const LEFT_KEYS = ["tempo", "meter", "phrasing"];
    const BOTTOM_KEYS = ["style", "quality", "texture", "energy"];
    const RIGHT_KEYS = ["sound", "tonal"];
    const SHACKLE = { on: "M8 11V8a4 4 0 018 0v3", off: "M8 11V8a4 4 0 017.4-2.1" };

    KEYS.forEach(k => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `
        <button type="button" class="lab-btn" aria-label="Reroll ${LAB[k]}" title="Click to reroll ${LAB[k]}" disabled>
          <span class="lab">${LAB[k]}</span>
          <svg class="re-icon" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4"/></svg>
        </button>
        <div class="ctl">
          <button type="button" class="ic lk" aria-label="Lock ${LAB[k]}" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="${SHACKLE.off}"/></svg>
          </button>
        </div>
        <div class="v-wrap">
          <span class="v">—</span>
          <span class="s"></span>
        </div>`;
      const labBtn = r.querySelector(".lab-btn");
      rows[k] = {
        el: r,
        v: r.querySelector(".v"),
        s: r.querySelector(".s"),
        labBtn,
        lk: r.querySelector(".lk"),
        p: r.querySelector(".lk path")
      };
      labBtn.onclick = () => { if (!L[k]) { P[k] = G[k](); paint([k]) } };
      rows[k].lk.onclick = () => { L[k] = !L[k]; paint([]) };
    });

    /* --- Sentence row --- */
    const sentenceRow = document.createElement("div"); sentenceRow.className = "row";
    sentenceRow.innerHTML = `
      <button type="button" class="lab-btn" aria-label="Reroll Sentence" title="Click to reroll Sentence" disabled>
        <span class="lab">Sentence</span>
        <svg class="re-icon" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4"/></svg>
      </button>
      <div class="ctl">
        <button type="button" class="ic lk" aria-label="Lock Sentence" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="${SHACKLE.off}"/></svg>
        </button>
      </div>
      <div class="v-wrap">
        <span class="v">—</span>
        <span class="s"></span>
      </div>`;
    const sLabBtn = sentenceRow.querySelector(".lab-btn");
    const sRow = {
      el: sentenceRow,
      v: sentenceRow.querySelector(".v"),
      s: sentenceRow.querySelector(".s"),
      labBtn: sLabBtn,
      lk: sentenceRow.querySelector(".lk"),
      p: sentenceRow.querySelector(".lk path")
    };
    let sentenceLocked = false;
    sLabBtn.onclick = () => {
      if (!sentenceLocked && KEYS.every(k => P[k])) {
        sentenceCfg.template = R(4);
        sentenceCfg.open = pick(OPENS);
        paint([], true);
      }
    };
    sRow.lk.onclick = () => {
      sentenceLocked = !sentenceLocked;
      sRow.el.classList.toggle("on", sentenceLocked);
      sRow.lk.setAttribute("aria-pressed", sentenceLocked);
      sRow.lk.setAttribute("aria-label", (sentenceLocked ? "Unlock" : "Lock") + " Sentence");
      sRow.p.setAttribute("d", sentenceLocked ? SHACKLE.on : SHACKLE.off);
      sRow.labBtn.disabled = sentenceLocked;
    };

    /* --- Responsive distribution --- */
    const mql = window.matchMedia("(min-width: 1100px)");
    function distributeRows(isWide) {
      if (isWide) {
        LEFT_KEYS.forEach(k => listLeft.appendChild(rows[k].el));
        BOTTOM_KEYS.forEach(k => listBottom.appendChild(rows[k].el));
        RIGHT_KEYS.forEach(k => listRight.appendChild(rows[k].el));
        listRight.appendChild(sRow.el);
      } else {
        KEYS.forEach(k => listBottom.appendChild(rows[k].el));
        listBottom.appendChild(sRow.el);
      }
    }
    mql.addEventListener("change", e => distributeRows(e.matches));
    distributeRows(mql.matches);

    function flash(el) { el.classList.remove("sw"); void el.offsetWidth; el.classList.add("sw") }
    function paint(changed, sentenceChanged = false) {
      KEYS.forEach(k => {
        const r = rows[k], d = P[k]; if (!d) return;
        r.v.textContent = d.v; r.s.textContent = d.s;
        r.el.classList.toggle("on", !!L[k]);
        r.lk.disabled = false; r.lk.setAttribute("aria-pressed", !!L[k]);
        r.lk.setAttribute("aria-label", (L[k] ? "Unlock " : "Lock ") + LAB[k]);
        r.p.setAttribute("d", L[k] ? SHACKLE.on : SHACKLE.off);
        r.labBtn.disabled = !!L[k];
        if (changed.includes(k)) { flash(r.v); flash(r.s) }
      });
      if (KEYS.every(k => P[k])) {
        sayEl.textContent = say(); sayEl.classList.remove("empty");
        if (changed.length || sentenceChanged) { flash(sayEl) }
        sRow.v.textContent = sentenceCfg.open + "…";
        sRow.s.textContent = ["narrative", "direct", "conversational", "shorthand"][sentenceCfg.template];
        sRow.lk.disabled = false; sRow.labBtn.disabled = sentenceLocked;
        if (sentenceChanged) { flash(sRow.v); flash(sRow.s) }
      }
      let b = 60 / P.tempo.bpm; while (b < .3) b *= 2;
      const e = P.energy.n;
      const hi = .15 + .04 * e;
      const st = document.documentElement.style;
      st.setProperty("--beat", b.toFixed(3) + "s"); st.setProperty("--hi", hi.toFixed(2)); st.setProperty("--lo", (hi * .35).toFixed(2));
      st.setProperty("--pulse-say-ring", Math.round(7 + 3.5 * e) + "%");
      st.setProperty("--pulse-say-glow", Math.round(4 + 2.0 * e) + "%");
      st.setProperty("--pulse-say-drop", Math.round(5 + 2.3 * e) + "%");
      st.setProperty("--pulse-card-ring", Math.round(5 + 2.4 * e) + "%");
      st.setProperty("--pulse-card-glow", Math.round(3 + 1.5 * e) + "%");
      st.setProperty("--pulse-card-drop", Math.round(4 + 1.9 * e) + "%");
    }
    function rollAll() {
      const first = !P.tempo, ch = KEYS.filter(k => first || !L[k]);
      ch.forEach(k => P[k] = G[k]());
      let sentenceChanged = false;
      if (!sentenceLocked) {
        sentenceCfg.template = R(4);
        sentenceCfg.open = pick(OPENS);
        sentenceChanged = true;
      }
      paint(ch, sentenceChanged);
    }
    document.getElementById("roll").onclick = rollAll;
    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") {
        e.preventDefault();
        rollAll();
      }
    });
    const pb = document.getElementById("pulse");
    pb.onclick = () => {
      const still = document.body.classList.toggle("still");
      pb.setAttribute("aria-pressed", !still); pb.querySelector("span").textContent = still ? "Pulse off" : "Pulse on"
    };

    /* --- Color picker --- */
    function hexToHSL(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0, s = 0, l = (max + min) / 2;
      if (d) {
        s = l > .5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }
    /* --- Theme toggle & color sync --- */
    const SUN_ICON = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    const MOON_ICON = `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const themeBtn = document.getElementById("themeToggle");
    const colorPick = document.getElementById("colorPick");

    const THEME_DEFAULTS = {
      dark: "#70b5ff",
      light: "#297dbc"
    };

    const chosenColors = {
      dark: null,
      light: null
    };

    function applyAccentColor(hex, theme) {
      const st = document.documentElement.style;
      if (!hex) {
        st.removeProperty("--acc");
        st.removeProperty("--glow");
        st.removeProperty("--flesh");
        return;
      }
      const [h, s, l] = hexToHSL(hex);
      st.setProperty("--acc", `hsl(${h}, ${s}%, ${l}%)`);
      if (theme === "light") {
        st.setProperty("--glow", `hsl(${h}, ${Math.max(s - 15, 20)}%, ${Math.min(Math.max(l + 30, 82), 95)}%)`);
        st.setProperty("--flesh", `hsl(${h}, ${Math.max(s - 10, 15)}%, ${Math.max(Math.min(l - 22, 34), 14)}%)`);
      } else {
        st.setProperty("--glow", `hsl(${h}, ${s}%, ${Math.max(l - 20, 10)}%)`);
        st.setProperty("--flesh", `hsl(${h}, ${Math.max(s - 15, 10)}%, ${Math.min(l + 12, 85)}%)`);
      }
    }

    function getSystemTheme() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    function getActiveTheme() {
      const saved = localStorage.getItem("cue-theme");
      if (saved === "light" || saved === "dark") return saved;
      return getSystemTheme();
    }
    function applyTheme(theme, isManual = false) {
      document.documentElement.setAttribute("data-theme", theme);
      if (isManual) {
        localStorage.setItem("cue-theme", theme);
      }
      themeBtn.innerHTML = theme === "dark" ? SUN_ICON : MOON_ICON;
      const label = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
      themeBtn.setAttribute("aria-label", label);
      themeBtn.setAttribute("title", label);

      const chosen = chosenColors[theme];
      if (chosen) {
        applyAccentColor(chosen, theme);
        colorPick.value = chosen;
      } else {
        applyAccentColor(null, theme);
        colorPick.value = THEME_DEFAULTS[theme];
      }
    }
    applyTheme(getActiveTheme());

    themeBtn.onclick = () => {
      const current = document.documentElement.getAttribute("data-theme") || getActiveTheme();
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next, true);
    };

    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => {
        if (!localStorage.getItem("cue-theme")) {
          applyTheme(e.matches ? "light" : "dark");
        }
      });
    }

    const onColorChange = e => {
      const theme = document.documentElement.getAttribute("data-theme") || getActiveTheme();
      chosenColors[theme] = e.target.value;
      applyAccentColor(e.target.value, theme);
    };
    colorPick.addEventListener("input", onColorChange);
    colorPick.addEventListener("change", onColorChange);

    /* --- Logo home route & reset --- */
    document.getElementById("logoLink").addEventListener("click", e => {
      if (window.location.protocol !== "file:") {
        e.preventDefault();
        const homePath = window.location.pathname.replace(/index\.html$/, "");
        window.location.href = homePath || "./";
      }
    });
  </script>
</body>

</html>
