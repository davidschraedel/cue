<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cue — improv music prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&family=Playfair+Display:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #070605;
      --fg: #e8dfd8;
      --mut: rgba(232, 223, 216, .46);
      --faint: rgba(232, 223, 216, .26);
      --line: rgba(255, 255, 255, .07);
      --acc: #70b5ff;
      --flesh: #a8d2ff;
      --glow: #0e4b82;
      --beat: 4s;
      --hi: .5;
      --lo: .2;
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --bg: #f3ece4;
        --fg: #2a1a12;
        --mut: rgba(42, 26, 18, .55);
        --faint: rgba(42, 26, 18, .32);
        --line: rgba(42, 26, 18, .12);
        --acc: #1264b5;
        --flesh: #0d4880;
        --glow: #a8d2ff;
      }
    }

    :root[data-theme="light"] {
      --bg: #f3ece4;
      --fg: #2a1a12;
      --mut: rgba(42, 26, 18, .55);
      --faint: rgba(42, 26, 18, .32);
      --line: rgba(42, 26, 18, .12);
      --acc: #1264b5;
      --flesh: #0d4880;
      --glow: #a8d2ff;
    }

    :root[data-theme="dark"] {
      --bg: #070605;
      --fg: #e8dfd8
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "DM Sans", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden
    }

    ::selection {
      background: var(--acc);
      color: #fff
    }

    .glow {
      position: fixed;
      left: 50%;
      top: 34%;
      width: min(900px, 120vw);
      aspect-ratio: 1.25;
      translate: -50% -50%;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--glow), transparent);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      opacity: var(--lo);
      animation: beat var(--beat) ease-in-out infinite
    }

    body.still .glow {
      animation: none;
      opacity: calc((var(--lo) + var(--hi)) * 0.45)
    }

    @keyframes beat {
      0% {
        opacity: var(--lo);
        scale: 1
      }

      14% {
        opacity: var(--hi);
        scale: 1.05
      }

      100% {
        opacity: var(--lo);
        scale: 1
      }
    }

    header,
    main,
    footer {
      position: relative;
      z-index: 1
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.6rem clamp(1.5rem, 5vw, 3.5rem)
    }

    .hdr-controls {
      display: flex;
      align-items: center;
      gap: 1rem
    }

    .color-pick {
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: none;
      overflow: hidden
    }

    .color-pick::-webkit-color-swatch-wrapper {
      padding: 0
    }

    .color-pick::-webkit-color-swatch {
      border: none;
      border-radius: 50%
    }

    .color-pick::-moz-color-swatch {
      border: none;
      border-radius: 50%
    }

    .mark {
      font-family: "Cormorant Garamond", serif;
      font-weight: 300;
      font-size: 1.7rem;
      letter-spacing: .35em;
      text-transform: uppercase
    }

    .pulse {
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: .78rem;
      letter-spacing: .12em;
      display: flex;
      align-items: center;
      gap: .7rem;
      cursor: pointer;
      padding: .5rem
    }

    .pulse i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--acc);
      display: block
    }

    body:not(.still) .pulse i {
      animation: beat var(--beat) ease-in-out infinite
    }

    .pulse:hover {
      color: var(--fg)
    }

    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 5vw, 3.5rem) 6rem
    }

    .hero {
      min-height: 58vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 0 2.5rem
    }

    .say {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.6rem, 3.6vw, 2.6rem);
      line-height: 1.38;
      max-width: 32em;
      margin: 0 0 3rem;
      padding: 1.2rem 1.8rem;
      border-radius: .8rem;
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      text-wrap: balance;
      text-shadow: 0 0 40px color-mix(in srgb, var(--acc) 30%, transparent)
    }

    .say.empty {
      color: var(--mut)
    }

    .roll {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--fg);
      background: color-mix(in srgb, var(--acc) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
      border-radius: 999px;
      padding: 1rem 3rem;
      cursor: pointer;
      transition: background .4s, border-color .4s
    }

    .roll:hover {
      background: color-mix(in srgb, var(--acc) 18%, transparent);
      border-color: var(--acc)
    }

    .hint {
      margin: 1.4rem 0 0;
      font-size: .78rem;
      letter-spacing: .06em;
      color: var(--faint)
    }

    .row {
      display: grid;
      grid-template-columns: 8.5rem 1fr auto;
      gap: 1rem;
      align-items: baseline;
      padding: 1.5rem 0;
      border-top: 1px solid var(--line)
    }

    .row:last-child {
      border-bottom: 1px solid var(--line)
    }

    .lab {
      font-size: .8rem;
      letter-spacing: .1em;
      color: var(--acc)
    }

    .v {
      font-family: "Playfair Display", serif;
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      line-height: 1.25;
      display: block;
      transition: color .4s
    }

    .s {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--mut);
      display: block;
      margin-top: .15rem;
      min-height: 1.2em
    }

    .row.on .v {
      color: var(--flesh)
    }

    .ctl {
      display: flex;
      gap: .25rem;
      align-self: center
    }

    .ic {
      width: 2.4rem;
      height: 2.4rem;
      background: none;
      border: 0;
      border-radius: 50%;
      color: var(--faint);
      cursor: pointer;
      display: grid;
      place-items: center;
      overflow: visible;
      transition: color .3s, background .3s
    }

    .ic:hover:not(:disabled) {
      color: var(--fg);
      background: var(--line)
    }

    .ic:disabled {
      opacity: .25;
      cursor: default
    }

    .ic[aria-pressed="true"] {
      color: var(--acc)
    }

    .ic svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ic[aria-pressed="true"] rect {
      fill: currentColor
    }

    button:focus-visible {
      outline: 1px solid var(--acc);
      outline-offset: 3px
    }

    .sw {
      animation: swap .6s ease-out
    }

    @keyframes swap {
      from {
        opacity: 0;
        filter: blur(7px)
      }

      to {
        opacity: 1;
        filter: none
      }
    }

    footer {
      text-align: center;
      padding: 0 1.5rem 3rem;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      color: var(--faint)
    }

    @media(max-width:640px) {
      .row {
        grid-template-columns: 1fr auto;
        row-gap: .3rem
      }

      .lab {
        grid-column: 1/-1
      }

      .hero {
        min-height: 52vh
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .glow,
      .pulse i {
        animation: none !important
      }

      .sw {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>
  <header>
    <span class="mark">Cue</span>
    <div class="hdr-controls">
      <input type="color" id="colorPick" class="color-pick" value="#70b5ff" title="Accent color">
      <button class="pulse" id="pulse" aria-pressed="true"><i></i><span>Pulse on</span></button>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="say empty" id="say" aria-live="polite">Press the button when you're ready.</p>
      <button class="roll" id="roll">New prompt</button>
      <p class="hint">Lock/unlock parameters. Click "New prompt" (Space bar)</p>
    </section>
    <section id="list" aria-label="Prompt parameters"></section>
  </main>
  <footer>
    <p>Create</p>
    <p style="margin-top:.8rem;font-size:.72rem;letter-spacing:.08em">© 2026 David Schraedel</p>
  </footer>
  <script>
    const R = n => Math.floor(Math.random() * n), pick = a => a[R(a.length)];
    const cap = s => s.replace(/(^|[.!?]\s+)([a-z])/g, (_, a, b) => a + b.toUpperCase());
    const KEYS = ["tempo", "meter", "phrasing", "style", "quality", "texture", "energy", "sound", "tonal"];
    const LAB = { tempo: "Tempo", meter: "Meter", phrasing: "Phrasing", style: "Style", quality: "Quality", texture: "Texture", energy: "Energy", sound: "Sound", tonal: "Tonal color" };

    const BANDS = [[55, ["glacial", "barely moving", "suspended"]], [75, ["slow and heavy", "unhurried", "wading"]], [100, ["walking pace", "easy", "loose"]], [130, ["moving", "brisk", "leaning forward"]], [160, ["driving", "urgent", "skittering"]], [999, ["racing", "frantic", "breathless"]]];
    const METERS = [[0, []], [2, []], [3, []], [4, []], [5, ["3+2", "2+3"]], [6, ["3+3", "2+2+2"]], [7, ["2+2+3", "3+2+2", "2+3+2"]], [9, ["3+3+3", "2+2+2+3", "4+5"]], [10, ["3+2+3+2", "5+5", "2+3+2+3"]], [11, ["3+3+3+2", "4+4+3", "2+2+3+2+2"]], [12, ["3+3+3+3", "4+4+4", "6+6"]], [13, ["3+3+3+2+2", "4+4+5"]]];
    const COUNTS = ["8", "8 + 8", "4", "4 + 4 + 8", "6", "12", "16", "7", "5 + 3", "8 + 8 + 4 + 4", "3 + 3 + 2", "10", "9", "2 × 8, then 4 + 4", "4 + 4 + 4 + 2", "5", "3", "11", "8 + 4", "6 + 6 + 4"];
    const ENTER = ["begin on 1", "pickup on the and of the last count", "start after a breath of silence", "come in on 3", "enter late, on 5", "start mid-gesture, no announcement", "build in from nothing"];
    const END = ["resolve on 1", "hold the last count", "fade out", "hard cut", "dissolve into silence", "repeat once, then stop", "trail off unfinished", "land on a single hit"];
    const STYLE = ["waltz", "march", "tango", "lullaby", "ritual", "mechanical", "industrial", "pastoral", "glitch", "blues", "lament", "processional", "carnival", "hymn", "folk dance", "brushed jazz", "trance", "music box", "chase scene", "heartbeat", "tide", "machine hum", "dub", "gamelan", "minimal ostinato", "breakbeat", "clockwork", "desert caravan", "nightclub", "underwater"];
    const QUAL = ["sustained", "percussive", "vibratory", "suspended", "swinging", "erratic", "collapsing", "bound", "floating", "released", "sharp", "melting", "pressing", "dragging", "quivering", "lunging", "hovering", "rolling", "heavy", "brittle", "slippery", "pulsing", "spiraling", "staccato"];
    const TEX = ["sparse", "dense", "a single line", "layered", "drone-based", "polyrhythmic", "clustered", "dry", "washed in reverb", "spacious", "thick", "interlocking", "call and response", "rubbed and scraped", "granular", "stacked ostinatos"];
    const REG = ["low", "mid", "high", "whole-range", "top and bottom, nothing between"];
    const ARC = ["steady", "building", "fading", "swelling", "lurching", "ebb and flow", "plateau, then drop", "sudden surges"];
    const SND = ["hand drums", "drum kit", "electronic drums", "synth", "piano", "electric keys", "bowed metal", "prepared piano", "found objects", "voice", "bass", "kalimba", "gong", "cymbal swells", "loop pedal", "contact mic", "shakers and rattles", "cello", "modular synth", "frame drum", "sampler", "singing bowls", "body percussion", "sine tones", "tape hiss"];
    const TON = ["major", "minor", "modal", "atonal", "drone", "noise", "unpitched", "pentatonic", "whole-tone", "clusters", "open fifths", "ambiguous", "dissonant", "bright", "dark", "bluesy"];

    const G = {
      tempo() {
        const bpm = 40 + R(151), feel = pick(BANDS.find(b => bpm <= b[0])[1]);
        const note = R(8) === 0 ? pick([", half-time feel", ", double-time feel"]) : "";
        const phrase = pick([`around ${bpm}`, `${bpm}, ${feel}`, `at about ${bpm}`, `${bpm} and ${feel}`]) + note;
        return { v: bpm + " BPM", s: feel + note, bpm, feel, note, phrase }
      },
      meter() {
        const [n, gs] = pick(METERS);
        if (!n) { const phrase = pick(["no meter, free time", "unmetered", "free time, no grid"]); return { v: "Free time", s: "no fixed pulse, breathe it", n: 0, phrase } }
        const g = gs.length ? pick(gs) : "";
        const phrase = g ? pick([`in ${n}, grouped ${g.replace(/\+/g, "-")}`, `a ${n} feel, ${g.replace(/\+/g, "-")}`]) : pick([`in ${n}`, `a ${n} feel`]);
        return { v: String(n), s: g ? "grouped " + g : "straight", n, g, phrase }
      },
      phrasing() {
        const c = pick(COUNTS), en = pick(ENTER), ed = pick(END);
        const phrase = pick([`phrases of ${c}`, `${c} counts`, `phrase it ${c}`]) + `, ${en}, ${ed}`;
        return { v: c + " counts", s: en + ", " + ed, c, en, ed, phrase }
      },
      style() { const a = pick(STYLE); let b = pick(STYLE); const v = R(4) === 0 && b !== a ? a + " meets " + b : a; return { v, s: "" } },
      quality() { return { v: pick(QUAL), s: "" } },
      texture() { const t = pick(TEX), r = pick(REG); return { v: t, s: r + " register", t, r } },
      energy() { const n = 1 + R(10), a = pick(ARC); return { v: n + " of 10", s: a, n, a } },
      sound() {
        if (R(12) === 0) return { v: "Your choice", s: "anything within reach", l: ["whatever you like"] };
        const a = pick(SND), l = [a];
        if (R(3) === 0) { const rest = SND.filter(x => x !== a); if (rest.length) l.push(pick(rest)) }
        return { v: l.join(" + "), s: "", l }
      },
      tonal() { return { v: pick(TON), s: "" } }
    };

    const OPENS = ["Give me", "Let's have", "Try", "I'd like", "Take"];
    const sentenceCfg = { template: 0, open: OPENS[0] };

    function say() {
      const { tempo: t, meter: m, phrasing: p, style: s, quality: q, texture: x, energy: e, sound: so, tonal: to } = P;
      const tm = t.phrase, mt = m.phrase, ph = p.phrase;
      const tx = `${x.t}, ${x.r} register`, sn = so.l.join(" and "), en = `energy at ${e.n}, ${e.a}`;
      const open = sentenceCfg.open;
      const T = [
        `${open} something ${mt}, ${tm}. ${q.v} and ${s.v}. ${ph}. ${tx}, on ${sn}. ${en}.`,
        `${mt}, ${tm}. Think ${s.v}, ${q.v}. ${ph}. ${sn}: ${tx}. Tonal color, ${to.v}. ${en}.`,
        `${open} ${s.v}, ${q.v}, ${mt} at ${t.bpm}. ${tx}. ${sn}. ${ph}. ${en}.`,
        `${sn}, please. ${s.v}, ${q.v}. ${mt}, ${tm}. ${ph}. ${tx}. ${en}, ${to.v}.`
      ];
      return cap(T[sentenceCfg.template]);
    }

    const P = {}, L = {}, rows = {};
    const list = document.getElementById("list"), sayEl = document.getElementById("say");
    const SHACKLE = { on: "M8 11V8a4 4 0 018 0v3", off: "M8 11V8a4 4 0 017.4-2.1" };
    KEYS.forEach(k => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span class="lab">${LAB[k]}</span><div><span class="v">—</span><span class="s"></span></div>
  <div class="ctl"><button class="ic re" aria-label="Reroll ${LAB[k]}" disabled><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4"/></svg></button>
  <button class="ic lk" aria-label="Lock ${LAB[k]}" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="${SHACKLE.off}"/></svg></button></div>`;
      list.appendChild(r);
      rows[k] = { el: r, v: r.querySelector(".v"), s: r.querySelector(".s"), re: r.querySelector(".re"), lk: r.querySelector(".lk"), p: r.querySelector(".lk path") };
      rows[k].re.onclick = () => { if (!L[k]) { P[k] = G[k](); paint([k]) } };
      rows[k].lk.onclick = () => { L[k] = !L[k]; paint([]) };
    });

    /* --- Sentence row --- */
    const sentenceRow = document.createElement("div"); sentenceRow.className = "row";
    sentenceRow.innerHTML = `<span class="lab">Sentence</span><div><span class="v">—</span><span class="s"></span></div>
    <div class="ctl"><button class="ic re" aria-label="Reroll Sentence" disabled><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4"/></svg></button>
    <button class="ic lk" aria-label="Lock Sentence" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="${SHACKLE.off}"/></svg></button></div>`;
    list.appendChild(sentenceRow);
    const sRow = {
      el: sentenceRow,
      v: sentenceRow.querySelector(".v"),
      s: sentenceRow.querySelector(".s"),
      re: sentenceRow.querySelector(".re"),
      lk: sentenceRow.querySelector(".lk"),
      p: sentenceRow.querySelector(".lk path")
    };
    let sentenceLocked = false;
    sRow.re.onclick = () => {
      if (!sentenceLocked && KEYS.every(k => P[k])) {
        sentenceCfg.template = R(4);
        sentenceCfg.open = pick(OPENS);
        sRow.v.textContent = sentenceCfg.open + "…";
        sRow.s.textContent = ["narrative", "direct", "conversational", "shorthand"][sentenceCfg.template];
        sayEl.textContent = say(); flash(sayEl); flash(sRow.v); flash(sRow.s);
      }
    };
    sRow.lk.onclick = () => {
      sentenceLocked = !sentenceLocked;
      sRow.el.classList.toggle("on", sentenceLocked);
      sRow.lk.setAttribute("aria-pressed", sentenceLocked);
      sRow.lk.setAttribute("aria-label", (sentenceLocked ? "Unlock" : "Lock") + " Sentence");
      sRow.p.setAttribute("d", sentenceLocked ? SHACKLE.on : SHACKLE.off);
      sRow.re.disabled = sentenceLocked;
    };

    function flash(el) { el.classList.remove("sw"); void el.offsetWidth; el.classList.add("sw") }
    function paint(changed) {
      KEYS.forEach(k => {
        const r = rows[k], d = P[k]; if (!d) return;
        r.v.textContent = d.v; r.s.textContent = d.s;
        r.el.classList.toggle("on", !!L[k]);
        r.lk.disabled = false; r.lk.setAttribute("aria-pressed", !!L[k]);
        r.lk.setAttribute("aria-label", (L[k] ? "Unlock " : "Lock ") + LAB[k]);
        r.p.setAttribute("d", L[k] ? SHACKLE.on : SHACKLE.off);
        r.re.disabled = !!L[k];
        if (changed.includes(k)) { flash(r.v); flash(r.s) }
      });
      if (KEYS.every(k => P[k])) {
        sayEl.textContent = say(); sayEl.classList.remove("empty"); flash(sayEl);
        sRow.v.textContent = sentenceCfg.open + "…";
        sRow.s.textContent = ["narrative", "direct", "conversational", "shorthand"][sentenceCfg.template];
        sRow.lk.disabled = false; sRow.re.disabled = sentenceLocked;
        if (changed.length) { flash(sRow.v); flash(sRow.s) }
      }
      let b = 60 / P.tempo.bpm; while (b < .3) b *= 2;
      const hi = .15 + .04 * P.energy.n;
      const st = document.documentElement.style;
      st.setProperty("--beat", b.toFixed(3) + "s"); st.setProperty("--hi", hi.toFixed(2)); st.setProperty("--lo", (hi * .35).toFixed(2));
    }
    function rollAll() {
      const first = !P.tempo, ch = KEYS.filter(k => first || !L[k]);
      ch.forEach(k => P[k] = G[k]());
      if (!sentenceLocked) {
        sentenceCfg.template = R(4);
        sentenceCfg.open = pick(OPENS);
      }
      paint(ch);
    }
    document.getElementById("roll").onclick = rollAll;
    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); rollAll() }
    });
    const pb = document.getElementById("pulse");
    pb.onclick = () => {
      const still = document.body.classList.toggle("still");
      pb.setAttribute("aria-pressed", !still); pb.querySelector("span").textContent = still ? "Pulse off" : "Pulse on"
    };

    /* --- Color picker --- */
    function hexToHSL(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0, s = 0, l = (max + min) / 2;
      if (d) {
        s = l > .5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }
    document.getElementById("colorPick").addEventListener("input", e => {
      const [h, s, l] = hexToHSL(e.target.value);
      const st = document.documentElement.style;
      st.setProperty("--acc", `hsl(${h}, ${s}%, ${l}%)`);
      st.setProperty("--glow", `hsl(${h}, ${s}%, ${Math.max(l - 20, 10)}%)`);
      st.setProperty("--flesh", `hsl(${h}, ${Math.max(s - 15, 10)}%, ${Math.min(l + 12, 85)}%)`);
    });
  </script>
</body>

</html>
